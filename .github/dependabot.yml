    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "OudyWorks"
    ignore:
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
